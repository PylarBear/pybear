{% extends "!layout.html" %}

<!--pydata_sphinx_theme doesn't render html_meta from conf.py into the actual
HTML <head> section the way standard Sphinx themes do. Need to put the meta
tags directly into layout.html using Jinja, which bypasses the theme and injects
them directly into the HTML output.-->
{% block extrahead %}
  {{ super() }}
  <meta name="google-site-verification" content="Vfm-HV9ibdA4ubmnyo7bO3KJ4LgmB48Lxp634CmYAPI">
  <meta name="description" content="pybear is a scikit-style Python computing library that augments data analytics functionality found in popular packages like scikit-learn and xgboost.">
{% endblock %}

{% block header %}
  {{ super() }}
  <div style="text-align: right; padding: 1em 1em;">
    <a href="https://www.buymeacoffee.com/pybear" target="_blank">
      <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png"
           alt="Buy Me A Coffee"
           style="height: 35px; width: 130px;">
    </a>
  </div>
{% endblock %}
